.ct{font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif}.ct p{line-height:1.9;margin:6px 0}.ct .art b{font-weight:700}.sig p{line-height:2}

.crf{font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;width:190mm;margin:auto;color:#111;font-size:12.5px;background:#fff}.cf-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #ffd200;padding-bottom:4px;margin-bottom:6px}.cf-t{font-size:22px;font-weight:700;letter-spacing:2px}.cf-t small{font-size:13px;font-weight:400;color:#555;letter-spacing:0}.cf-logo{height:44px;display:block}.cf-sec{border:1.5px solid #222;margin-bottom:6px;padding:0 8px 6px}.cf-h{background:#ffd200;margin:0 -8px 6px;padding:3px 8px;display:flex;justify-content:space-between;border-bottom:1.5px solid #222}.cf-h.c{justify-content:center}.cf-h b{letter-spacing:4px}.cf-consent{margin:2px 0 4px;font-size:11.5px}.cf-g1,.cf-g2,.cf-g3{display:grid;gap:2px 14px;margin:5px 0;line-height:1.8}.cf-g2{grid-template-columns:1fr 1fr}.cf-g3{grid-template-columns:1fr 1fr 1fr}.cf-g2>div,.cf-g3>div,.cf-g1{display:flex;flex-wrap:wrap;align-items:baseline}.cf-l{white-space:nowrap;margin-right:2px}.cf-u{flex:1;border-bottom:1px solid #333;min-height:18px;padding:0 4px;color:#1a3fa0}.cf-c{margin-right:10px;white-space:nowrap}.cf-note .cf-u{min-height:36px}.cf-tb{width:100%;border-collapse:collapse}.cf-tb th,.cf-tb td{border:1px solid #333;height:22px;padding:2px 6px;font-size:12px;text-align:left;color:#1a3fa0}.cf-tb th{text-align:center;color:#111;background:#fdf3d0}.cf-foot{text-align:center;font-size:10.5px;color:#777}@media print{@page{size:A4 portrait;margin:9mm}.crf{width:auto}}
.crfed .opts{display:flex;flex-wrap:wrap;gap:4px}.crfed .opts label{display:inline-flex;align-items:center;gap:3px;border:1px solid #ccc;border-radius:14px;padding:3px 10px;font-size:14px;color:#222}.crfed .opts input{width:auto}
.crfed h4{margin:10px 0 4px;background:var(--y);padding:3px 8px;border-radius:6px}
.brand{display:flex;align-items:center;gap:8px}#hdLogo{height:30px;background:#fff;border-radius:6px;padding:2px 6px}
.plogo{height:46px;display:block;margin:0 0 6px auto}

#login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:6px}#login h3{margin:4px 0 8px}#lgLogo{height:46px;align-self:flex-start}
#login label{font-size:13px;color:var(--g)}#login input{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:16px}
#login button{margin-top:8px}#lgErr{color:var(--r);min-height:1.2em;font-size:14px}#lgUrlRow{display:flex;flex-direction:column;gap:6px}
#ft{text-align:center;padding:10px 0 24px}#ft .out{background:none;border:0;color:var(--g);text-decoration:underline;font-size:13px}
</style></head><body>

<button data-v="list">案件</button><button data-v="prices">單價庫</button><button onclick="newCustomer()">＋客戶</button></header>
<main id="app"></main><footer id="ft" class="noprint"><button class="out" onclick="logout()">登出這台裝置</button></footer><div id="login"><form id="lgForm" class="card"><img id="lgLogo" alt="蜂宅 BEE HOME"><h3>蜂宅 CRM・報價</h3>
<div id="lgUrlRow"><label>Apps Script 網址（只要貼一次）</label><input id="lgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>

<script>
// ===== 共用計算邏輯（伺服器與網頁共用）=====
var BH = {
  CM_PER_CHI: 30.3,          // 1 台尺 = 30.3 cm
  CM2_PER_PING: 33058,       // 1 坪 ≈ 3.3058 m² = 33058 cm²
  CM2_PER_CAI: 918.09,       // 1 才 = 1 台尺 × 1 台尺 = 30.3² cm²
  CATEGORIES: ['保護工程','拆除工程','泥作工程','水電工程','木作工程','智能家居工程','其他工程','油漆工程','系統櫃工程','燈具工程','清潔工程','木地板工程','客變工程'],
  STAGES: ['詢問','丈量','提案','簽約','施工','完工'],
  PAYMENTS: [['訂金',10],['開工',40],['木作結束',40],['驗收',10]],
  DESIGN_FEE_RATE: 0.05
};
function bhNum(v){ var n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isNaN(n)?0:n; }
function bhRound(n,d){ var p=Math.pow(10,d==null?2:d); return Math.round((n+1e-9)*p)/p; }
// 依單位把公分換算成數量。w=寬/長(cm)，h=高/深(cm)，可省略
function bhConvert(unit, w, h){
  w=bhNum(w); h=bhNum(h);
  switch(unit){
    case '尺': return bhRound(w/BH.CM_PER_CHI,1);
    case '坪': return h? bhRound(w*h/BH.CM2_PER_PING,2) : 0;
    case '才': return h? Math.ceil(bhRound(w*h/BH.CM2_PER_CAI,2)*10)/10 : 0;
    case 'm':  return bhRound(w/100,2);
    case 'm²': case '平方米': return h? bhRound(w*h/10000,2) : 0;
    default: return null; // 個/組/式等：無法換算，請手填數量
  }
}
function bhSizeLabel(w,h){ w=bhNum(w);h=bhNum(h); if(!w) return ''; return h? (w+'×'+h+'cm') : (w+'cm'); }
// 計算報價：lines=[{category,qty,cost,price}]
function bhCalcQuote(lines, feeRate){
  feeRate = feeRate==null?BH.DESIGN_FEE_RATE:feeRate;
  var byCat={}, sub=0, cost=0, missingCost=0;
  lines.forEach(function(l){
    var q=bhNum(l.qty), s=bhRound(q*bhNum(l.price),0);
    var c=bhRound(q*bhNum(l.cost),0);
    if(l.cost===''||l.cost==null) missingCost++;
    byCat[l.category]=(byCat[l.category]||0)+s; sub+=s; cost+=c;
  });
  var fee=bhRound(sub*feeRate,0), total=sub+fee;
  var margin=total-cost;
  return {byCat:byCat, subtotal:sub, fee:fee, total:total, cost:cost, margin:margin,
          marginPct: total? bhRound(margin/total*100,1):0, missingCost:missingCost};
}
function bhPaySchedule(total){
  var out=[], acc=0;
  BH.PAYMENTS.forEach(function(p,i){
    var amt = i===BH.PAYMENTS.length-1 ? total-acc : Math.round(total*p[1]/100);
    acc+=amt; out.push({name:p[0], pct:p[1], amount:amt});
  });
  return out;
}
function bhNextId(prefix, ids, width){
  var max=0; ids.forEach(function(id){ id=String(id); if(id.indexOf(prefix)===0){ var n=parseInt(id.slice(prefix.length),10); if(n>max) max=n; }});
  var s=String(max+1); while(s.length<width) s='0'+s; return prefix+s;
}

// ===== 工期表 =====
// 工期進度表的固定列（順序同蜂宅過往工期進度表）
BH.SCHED_ROWS=['保護工程','拆除工程','泥作工程','木作工程','水電/弱電工程','空調(設備)工程','鋁窗/鐵窗工程','油漆工程','壁紙傢飾工程','燈具工程','系統櫃工程','清潔工程','窗簾工程'];
// 預設工作天數（由過往工期表的實際施工天數估算，老闆可在「工期預設」分頁修改）
BH.DURATIONS={'保護工程':2,'拆除工程':3,'泥作工程':5,'水電/弱電工程':5,'空調(設備)工程':5,'鋁窗/鐵窗工程':3,'木作工程':20,'油漆工程':10,'木地板工程':3,'系統櫃工程':10,'燈具工程':2,'清潔工程':1,'壁紙傢飾工程':4,'窗簾工程':2};
// 實際施工先後（過往工期表：保護→拆除→水電＋空調→木作→油漆→系統櫃→燈具→清潔→壁紙＋窗簾）
BH.SCHED_ORDER=['保護工程','拆除工程','泥作工程','水電/弱電工程','空調(設備)工程','鋁窗/鐵窗工程','木作工程','油漆工程','木地板工程','系統櫃工程','燈具工程','清潔工程','壁紙傢飾工程','窗簾工程'];
BH.SCHED_PAR={'空調(設備)工程':1,'窗簾工程':1};  // 與上一項同時開工
// 報價工程類別 → 工期表列
BH.CAT_TO_SCHED={'保護工程':'保護工程','拆除工程':'拆除工程','泥作工程':'泥作工程','水電工程':'水電/弱電工程','智能家居工程':'水電/弱電工程','木作工程':'木作工程','油漆工程':'油漆工程','系統櫃工程':'系統櫃工程','燈具工程':'燈具工程','清潔工程':'清潔工程','木地板工程':'木地板工程'};
function bhD(s){var m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?new Date(Date.UTC(+m[1],m[2]-1,+m[3])):null}
function bhDs(d){return d.toISOString().slice(0,10)}
// skip：'六日'＝週六日休、'日'＝只休週日、其他＝不跳過；holidays：['2026-01-01',...]
function bhIsWork(ds,skip,holidays){var w=bhD(ds).getUTCDay();
  if(skip==='六日'&&(w===0||w===6))return false; if(skip==='日'&&w===0)return false;
  return !(holidays&&holidays.indexOf(ds)>=0)}
function bhNextWork(ds,skip,hol){var d=bhD(ds);for(var i=0;i<400;i++){var s=bhDs(d);if(bhIsWork(s,skip,hol))return s;d.setUTCDate(d.getUTCDate()+1)}return ds}
// 從 start（含）起算 n 個工作天，回傳最後一天
function bhAddWork(start,n,skip,hol){var s=bhNextWork(start,skip,hol),c=1,d=bhD(s);n=Math.max(1,Math.round(bhNum(n)||1));
  while(c<n){d.setUTCDate(d.getUTCDate()+1);if(bhIsWork(bhDs(d),skip,hol))c++}return bhDs(d)}
function bhDayAfter(ds){var d=bhD(ds);d.setUTCDate(d.getUTCDate()+1);return bhDs(d)}
// rows=[{cat,days,par}]；par=true 表示與上一項同時開工
function bhSchedule(rows,start,skip,hol){var prevS=null,prevE=null,last=null;
  var out=rows.map(function(r){var s=(r.par&&prevS)?prevS:(prevE?bhNextWork(bhDayAfter(prevE),skip,hol):bhNextWork(start,skip,hol));
    var e=bhAddWork(s,r.days,skip,hol);var o={cat:r.cat,days:Math.max(1,Math.round(bhNum(r.days)||1)),par:!!r.par,note:r.note||'',start:s,end:e};
    prevS=s;prevE=(prevE&&r.par&&prevE>e)?prevE:e;if(!last||e>last)last=e;return o});
  var first=out.length?out[0].start:start,cal=0;if(out.length){cal=Math.round((bhD(last)-bhD(first))/864e5)+1}
  var wd=0;if(out.length){var d=bhD(first);while(bhDs(d)<=last){if(bhIsWork(bhDs(d),skip,hol))wd++;d.setUTCDate(d.getUTCDate()+1)}}
  return {rows:out,start:first,end:last||start,calendarDays:cal,workDays:wd}}
// 報價中出現的工程類別 → 預設工期列（其他工程、客變工程不排入，可在編輯時自行加）
function bhScheduleRowsFromCats(cats,dur){dur=dur||{};var has={};cats.forEach(function(c){var m=BH.CAT_TO_SCHED[c];if(m)has[m]=1});
  return BH.SCHED_ORDER.filter(function(c){return has[c]}).map(function(c){return {cat:c,days:dur[c]||BH.DURATIONS[c]||3,par:!!BH.SCHED_PAR[c]}})}
// 2026-11-02 → 中華民國115年11月2日
function bhRoc(ds){var d=bhD(ds);return d?'中華民國'+(d.getUTCFullYear()-1911)+'年'+(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日':''}
// ===== 合約 =====
function bhChineseMoney(n){n=Math.round(bhNum(n));if(!n)return '新台幣零元整';var D='零壹貳參肆伍陸柒捌玖',U=['仟','佰','拾',''],B=['','萬','億'],str=String(n),out='',zero=false;
  for(var i=0;i<str.length;i++){var pos=str.length-1-i,x=+str[i],ui=3-pos%4;
    if(x){if(zero)out+='零';out+=D[x]+U[ui];zero=false}else zero=true;
    if(pos%4===0&&pos>0){var grp=str.slice(Math.max(0,i-3),i+1);if(+grp)out+=B[pos/4]}}
  return '新台幣'+out+'元整'}
// {{欄位}} 換成資料；沒有資料就留底線空白
function bhFill(text,map){return String(text||'').replace(/\{\{([^}]+)\}\}/g,function(_,k){var v=map[k.trim()];return (v===''||v==null)?'＿＿＿＿＿＿':String(v)})}

function crfFields(){ var o=[]; CRF.SECTIONS.forEach(function(s){ s[1].forEach(function(f){ o.push(f); }); }); return o; }
// 驗證與清理：只收已定義欄位、去頭尾空白、限制長度、勾選項只收定義中的選項
function crfClean(input, isPublic){
  input = input || {}; var out = {}, err = [];
  crfFields().forEach(function(f){
    if (isPublic && CRF.INTERNAL.indexOf(f[0])>=0) return;
    var v = input[f[0]], t = f[2];
    if (t==='checks'){ var arr = Array.isArray(v)? v : (v? String(v).split('、') : []);
      out[f[0]] = arr.map(String).filter(function(x){ return f[3].indexOf(x)>=0; }).filter(function(x,i,a){return a.indexOf(x)===i;}); return; }
    v = String(v==null?'':v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').trim();
    if (t==='radio'){ out[f[0]] = f[3].indexOf(v)>=0 ? v : ''; return; }
    var max = t==='date'?10 : (typeof f[3]==='number'? f[3] : 60);
    if (v.length>max){ err.push(f[1]+'太長（最多 '+max+' 字）'); v=v.slice(0,max); }
    if (t==='date' && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)){ err.push(f[1]+'格式錯誤'); v=''; }
    if (t==='email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) err.push('E-mail 格式錯誤');
    if (t==='tel' && v && !/^[0-9+\-()#\s]{6,20}$/.test(v)) err.push('電話格式錯誤');
    // 試算表公式注入防護：開頭是 = + - @ 的文字前面加 '
    if (/^[=+\-@]/.test(v) && t!=='tel') v = "'"+v;
    out[f[0]] = v;
  });
  if (isPublic){
    if (!out['姓名']) err.push('請填姓名');
    if (!out['電話'] && !out['LINE'] && !out['Email']) err.push('電話、LINE、E-mail 至少填一項');
  }
  return {data: out, errors: err};
}

// 部署後的 Apps Script 網址；留空時在登入畫面貼上一次即可（存在這台裝置）
var API_URL_DEFAULT='https://script.google.com/macros/s/AKfycbyfAxoHYI9FbyxKaYI7NyoacJNKbn5pnJRJYdMVg08N_nqEVy6bzlUypevj23SHFfLW/exec';
var K_URL='bhCrmApiUrl',K_TOK='bhCrmToken';
function apiUrl(){return API_URL_DEFAULT||localStorage.getItem(K_URL)||''}
function post(body){var u=apiUrl();if(!u)return Promise.reject(new Error('尚未設定 Apps Script 網址'));
  return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('連線失敗（HTTP '+r.status+'）');return r.text()})
    .then(function(t){try{return JSON.parse(t)}catch(e){throw new Error('伺服器回應格式不對：請確認網址是 /exec 結尾，且部署時存取權選「任何人」')}})}
function api(fn){var a=[].slice.call(arguments,1);
  return post({action:'call',fn:fn,args:a,token:localStorage.getItem(K_TOK)||''}).then(function(j){
    if(j.ok)return j.result;
    if(j.error==='auth'){localStorage.removeItem(K_TOK);showLogin('登入已過期，請重新輸入密碼');var e=new Error('auth');e.auth=1;throw e}
    throw new Error(j.error||'發生錯誤')}).catch(function(e){if(!e.auth)alert(e.message||e);throw e})}
function showLogin(msg){$('#login').style.display='flex';$('#lgUrlRow').style.display=API_URL_DEFAULT?'none':'';
  $('#lgUrl').value=apiUrl();$('#lgErr').textContent=msg||'';$('#lgPw').value='';setTimeout(function(){(apiUrl()?$('#lgPw'):$('#lgUrl')).focus()},50)}
function doLogin(ev){ev.preventDefault();var u=$('#lgUrl').value.trim(),err=$('#lgErr');
  if(!API_URL_DEFAULT){if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){err.textContent='網址要是 https://script.google.com/…/exec';return}localStorage.setItem(K_URL,u)}
  err.textContent='登入中…';$('#lgBtn').disabled=true;
  post({action:'login',password:$('#lgPw').value}).then(function(j){
    if(!j.ok)throw new Error(j.error||'登入失敗');
    localStorage.setItem(K_TOK,j.token);$('#login').style.display='none';$('#app').textContent='載入中…';return load()})
  .catch(function(e){err.textContent=e.message||String(e)}).then(function(){$('#lgBtn').disabled=false})}
function logout(){if(!confirm('登出這台裝置？'))return;localStorage.removeItem(K_TOK);D=null;$('#app').textContent='';showLogin('')}
function boot(){$('#lgForm').onsubmit=doLogin;
  if(apiUrl()&&localStorage.getItem(K_TOK))load().catch(function(e){if(!e.auth)$('#app').textContent='載入失敗：'+(e.message||e)});else showLogin('')}

    '<table class="gantt ghd"><tr><td>客戶編號：'+esc(c['客戶ID'])+'</td><td>客戶名稱：'+esc(c['姓名'])+'</td></tr><tr><td>訂單編號：'+esc(s['報價ID'])+'</td><td>工程承攬方：'+esc(st['廠商署名'])+'</td></tr><tr><td>工程地址 / 屋主車位：'+esc(siteAddr(k,c))+'</td><td>建表日期：'+s['日期']+'</td></tr></table>'+
    '<table class="gantt"><tr><th class="gn">工作天數</th>'+days.map(function(x){return cell(x,wcount[x]||'')}).join('')+pad+'</tr>'+
    '<tr><th class="gn">月</th>'+days.map(function(x){return cell(x,mo)}).join('')+pad+'</tr><tr><th class="gn">日</th>'+days.map(function(x){return cell(x,+x.slice(8))}).join('')+pad+'</tr>'+
    '<tr><th class="gn">星期</th>'+days.map(function(x){return cell(x,wk[bhD(x).getUTCDay()])}).join('')+pad+'</tr>'+
    rowsN.map(function(name){var rs=S.sr.filter(function(r){return r['工程類別']===name});
      return '<tr><th class="gn">'+esc(name)+'</th>'+days.map(function(x){var on=rs.some(function(r){return x>=r['開始']&&x<=r['結束']})&&!off(x);
        var note=rs.filter(function(r){return r['備註']&&r['開始']===x}).map(function(r){return r['備註']})[0];
        return cell(x,(on?'●':'')+(note?'<span class="gnote">'+esc(note)+'</span>':''))}).join('')+pad+'</tr>'}).join('')+
    '</table><table class="gantt gft"><tr><td rowspan="2" style="width:50%"></td><td>客戶簽名/日期：</td></tr><tr><td>廠商/日期：</td></tr></table></div></div>'}).join('');
  $('#app').innerHTML=h}
// ---- 合約 ----
function openContract(){var k=kase(S.caseId),ss=scheds(k['案件ID']),s=ss[0];
  if(s) return api('getScheduleRows',s['工期ID']).then(function(){S.view='contract';render()});S.view='contract';render()}
BH.PAY_NODES={'開工':'保護工程完成','木作結束':'木工工程完成','驗收':'完工清潔'};
function contractMap(){var k=kase(S.caseId),c=cust(k['客戶ID']),st=D.settings,s=scheds(k['案件ID'])[0]||{},q=pickQuote(k['案件ID'])||{};
  var total=bhNum(k['合約總價'])||bhNum(q['總價']),ps=pays(k['案件ID']),cn='一二三四五六七八九十';
  var pl=(ps.length?ps.map(function(p){return {name:p['期別'],pct:p['比例%'],amount:p['應收金額']}}):(total?bhPaySchedule(total):[]));
  return {'案名':caseName(k,c),'甲方姓名':c['姓名'],'甲方電話':c['電話'],'甲方地址':(S.ctOv&&S.ctOv.c===S.caseId&&S.ctOv['甲方地址']!=null)?S.ctOv['甲方地址']:(c['地址']||k['地址']||''),'乙方名稱':st['合約公司名稱']||st['公司名稱'],'乙方負責人':st['公司負責人']||st['廠商署名'],'乙方統編':st['公司統編'],'乙方地址':st['公司地址'],'乙方電話':st['公司電話'],'乙方登記證號':st['登記證書字號'],
    '工程地點':(S.ctOv&&S.ctOv.c===S.caseId&&S.ctOv['工程地點']!=null)?S.ctOv['工程地點']:siteAddr(k,c),'案件編號':k['案件ID'],'報價編號':q['報價ID'],'合約總價數字':total?String(Math.round(total)):'','合約總價':total?money(total):'','合約總價大寫':total?bhChineseMoney(total):'',
    '付款表':pl.length?pl.map(function(p,i){var amt=Math.round(bhNum(p.amount));return cn[i]+'、'+(i===0?'本契約簽訂日，甲方支付工程總價'+p.pct+'%簽約金計'+amt+'元。':'依附件進行至節點'+(i+1)+'：'+(BH.PAY_NODES[p.name]||p.name)+'時，甲方'+(i===pl.length-1?'應':'')+'支付工程總價'+p.pct+'%計'+amt+'元。')}).join('\n'):'',
    '開工日':s['開工日'],'完工日':s['完工日'],'開工日民國':s['開工日']?bhRoc(s['開工日']):'','完工日民國':s['完工日']?bhRoc(s['完工日']):'','工作天數':s['工作天數'],'工期編號':s['工期ID'],'代辦費用':'','規費預付日數':''}}
function vContract(){var m=contractMap(),miss=Object.keys(m).filter(function(x){return (m[x]===''||m[x]==null)&&['代辦費用','規費預付日數','乙方登記證號'].indexOf(x)<0}),F=function(t){return esc(bhFill(t,m))};
  var h='<div class="noprint row" style="max-width:800px;margin:0 auto 10px"><button class="p" onclick="window.print()">🖨 列印 / 存 PDF</button><button class="s" onclick="S.view=\'ctEdit\';render()">編輯合約範本</button><button class="s" onclick="S.view=\'case\';render()">返回</button></div>'+
  '<div class="card noprint row" style="max-width:800px;margin:0 auto 10px"><label>甲方地址</label><input id="ovA" style="flex:1" value="'+esc(m['甲方地址'])+'"><label>工程地點</label><input id="ovS" style="flex:1" value="'+esc(m['工程地點'])+'"><button class="s" onclick="S.ctOv={c:S.caseId,\'甲方地址\':$(\'#ovA\').value,\'工程地點\':$(\'#ovS\').value};render()">套用（只改這份）</button></div>'+(miss.length?'<div class="card noprint muted" style="max-width:800px;margin:0 auto 10px">⚠ 以下資料空白，會印成底線讓你手寫：'+miss.join('、')+'</div>':'')+
  '<div class="pq ct"><img class="plogo" src="'+BH_LOGO+'"><h2>建築物室內裝修—'+F('{{案名}}')+'工程承攬契約書</h2>'+
  '<p>立契約書人──消費者：'+F('{{甲方姓名}}')+'　（以下簡稱甲方）<br>業者：'+F('{{乙方負責人}}')+'　（以下簡稱乙方）<br>乙方登記證書字號或專業證照字號：'+F('{{乙方登記證號}}')+'<br>茲因甲方委託乙方辦理室內裝修工程，經雙方同意訂立本契約，約定條款如下：</p>'+
  D.contract.map(function(c){return '<p class="art"><b>'+F(c['標題'])+'</b>'+(c['內容']?'<br>'+F(c['內容']).replace(/\n/g,'<br>'):'')+'</p>'}).join('')+
  '<div class="sig"><p><b>立委任契約書人</b></p><p>甲　　方：'+F('{{甲方姓名}}')+'<br>負 責 人：<br>統一編號或國民身分證統一編號：<br>地　　址：'+F('{{甲方地址}}')+'<br>電　　話：'+F('{{甲方電話}}')+'</p>'+
  '<p>乙　　方：'+F('{{乙方名稱}}')+'<br>負 責 人：'+F('{{乙方負責人}}')+'<br>統一編號：'+F('{{乙方統編}}')+'<br>地　　址：'+F('{{乙方地址}}')+'<br>電　　話：'+F('{{乙方電話}}')+'</p></div>'+
  '<p style="text-align:center;letter-spacing:4px;margin-top:24px">中華民國　　　　年　　　　月　　　　日</p><p class="muted" style="font-size:12px">附件：估價單（'+F('{{報價編號}}')+'）、工程施工進度表（'+F('{{工期編號}}')+'）、設計施工圖說</p></div>';
  $('#app').innerHTML=h}
function vCtEdit(){var keys=Object.keys(contractMap());
  var h='<div class="card"><b>合約範本</b><p class="muted">直接改條款文字。可用的自動欄位：'+keys.map(function(x){return '{{'+x+'}}'}).join(' ')+'</p><div id="cts">'+
  D.contract.map(function(c,i){return '<div class="ctb"><input data-t="'+i+'" value="'+esc(c['標題'])+'"><textarea data-c="'+i+'" rows="4">'+esc(c['內容'])+'</textarea><button class="s" onclick="D.contract.splice('+i+',1);vCtEdit()">刪除此條</button></div>'}).join('')+
  '</div><br><div class="row"><button class="s" onclick="ctSync();D.contract.push({\'標題\':\'新條款\',\'內容\':\'\'});vCtEdit()">＋加條款</button><button class="p" onclick="ctSync();api(\'saveContractTemplate\',D.contract).then(function(){toast(\'範本已儲存\');S.view=\'contract\';load()})">儲存範本</button><button class="s" onclick="S.view=\'contract\';load()">取消</button></div></div>';
  $('#app').innerHTML=h}
function ctSync(){document.querySelectorAll('[data-t]').forEach(function(e){D.contract[+e.dataset.t]['標題']=e.value});document.querySelectorAll('[data-c]').forEach(function(e){D.contract[+e.dataset.c]['內容']=e.value})}
// ---- 客戶需求表 ----
function openCrf(){var c=(D.crfs||[]).filter(function(r){return r['案件ID']===S.caseId})[0];
  if(c)return openCrfId(c['需求表ID']);var k=kase(S.caseId),cu=cust(k['客戶ID']);
  S.crf={row:{'客戶ID':k['客戶ID'],'案件ID':k['案件ID']},data:{'姓名':cu['姓名'],'電話':cu['電話'],'LINE':cu['LINE'],'Email':cu['Email'],'地址':siteAddr(k,cu),'坪數':k['坪數'],'建案名稱':k['案名'],'規劃顧問':k['負責人'],'填表日期':D.today},contacts:[]};S.view='crf';render()}
function openCrfId(id,ro){api('getCRF',id).then(function(r){S.crf=r;S.crfRO=!!ro;S.view=ro?'crfPrint':'crf';render()})}
function crfInput(f,v){var k=f[0];if(f[2]==='checks'||f[2]==='radio'){v=v||(f[2]==='checks'?[]:'');return '<div class="opts">'+f[3].map(function(o){var on=f[2]==='checks'?v.indexOf(o)>=0:v===o;return '<label><input type="'+(f[2]==='checks'?'checkbox':'radio')+'" name="cf_'+k+'" value="'+esc(o)+'"'+(on?' checked':'')+'>'+esc(o)+'</label>'}).join('')+'</div>'}
  if(f[2]==='textarea')return '<textarea data-cf="'+k+'" rows="3">'+esc(v)+'</textarea>';return '<input data-cf="'+k+'" type="'+(f[2]==='date'?'date':'text')+'" value="'+esc(v)+'">'}
function vCrf(){var r=S.crf,d=r.data||{},k=kase(r.row['案件ID'])||{};
  var h='<div class="card crfed"><div class="row"><b style="margin-right:auto">📝 客戶需求表 '+esc(r.row['需求表ID']||'（新）')+(r.row['填表方式']==='線上'?' <span class="tag">客戶線上填寫</span>':'')+'</b><button class="s" onclick="crfSave(1)">🖨 存檔並列印</button></div>'+
  CRF.SECTIONS.map(function(sec){return '<h4>'+sec[0]+'</h4><div class="grid">'+sec[1].map(function(f){var wide=f[2]==='checks'||f[2]==='radio'||f[2]==='textarea';
    return '<div'+(wide?' style="grid-column:1/-1"':'')+'><label>'+f[1]+'</label>'+crfInput(f,d[f[0]])+'</div>'}).join('')+'</div>'}).join('')+
  '<p><label style="display:inline"><input type="checkbox" id="cfOk" style="width:auto"'+(d['_同意']?' checked':'')+'> 客戶已同意個資條款</label></p>'+
  '<div class="row"><button class="p" onclick="crfSave()">儲存</button><button class="s" onclick="S.view=\'case\';render()">返回</button></div></div>';
  h+='<div class="card"><b>聯繫紀錄</b><div class="scroll"><table><tr><th style="width:120px">日期</th><th>內容</th></tr>'+(r.contacts||[]).map(function(c){return '<tr><td>'+esc(c['日期'])+'</td><td>'+esc(c['內容'])+'</td></tr>'}).join('')+'</table></div>'+
  (r.row['需求表ID']?'<div class="row" style="margin-top:6px"><input type="date" id="ctD" value="'+D.today+'" style="max-width:160px"><input id="ctT" placeholder="例：電話約丈量 11/5 下午" style="flex:1"><button class="p" id="ctAdd" onclick="crfAddCt()">＋新增</button></div>':'<p class="muted">先儲存需求表才能新增聯繫紀錄。</p>')+'</div>';
  $('#app').innerHTML=h}
function crfCollect(){var o={};crfFields().forEach(function(f){var k=f[0];if(f[2]==='checks')o[k]=[].slice.call(document.querySelectorAll('[name="cf_'+k+'"]:checked')).map(function(i){return i.value});
  else if(f[2]==='radio'){var i=document.querySelector('[name="cf_'+k+'"]:checked');o[k]=i?i.value:''}else{var i=document.querySelector('[data-cf="'+k+'"]');o[k]=i?i.value:''}});o['_同意']=$('#cfOk').checked;return o}
function crfSave(pr){var d=crfCollect();api('saveCRF',S.crf.row,d).then(function(res){if(res.warnings.length)toast('⚠ '+res.warnings.join('；'));else toast('需求表已儲存');
  return load().then(function(){return api('getCRF',res.id)}).then(function(r){S.crf=r;S.view=pr?'crfPrint':'crf';render()})})}
function crfAddCt(){var t=$('#ctT').value;if(!t.trim())return;api('addContact',S.crf.row['需求表ID'],$('#ctD').value,t).then(function(){return api('getCRF',S.crf.row['需求表ID'])}).then(function(r){S.crf=r;toast('已新增聯繫紀錄');vCrf()})}
function convCrf(id){api('convertCRF',id).then(function(r){toast('已建立 '+r.customerId+' / '+r.caseId);S.caseId=r.caseId;S.view='case';load()})}
function vCrfPrint(){var r=S.crf;$('#app').innerHTML='<div class="noprint row" style="max-width:800px;margin:0 auto 10px"><button class="p" onclick="window.print()">🖨 列印 / 存 PDF</button>'+(r.row['狀態']==='待處理'?'<button class="p" onclick="convCrf(\''+r.row['需求表ID']+'\')">轉成客戶＋案件</button>':'<button class="s" onclick="S.view=\'crf\';render()">編輯</button>')+'<button class="s" onclick="S.view=S.crf.row[\'案件ID\']?\'case\':\'list\';render()">返回</button></div>'+
  crfPrintHtml(r.data,r.contacts,{id:r.row['客戶ID']||r.row['需求表ID']})}

document.getElementById('hdLogo').src=BH_LOGO;$('#lgLogo').src=BH_LOGO;
boot();
</script></body></html>
